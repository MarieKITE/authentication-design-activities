<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Marie Beuthel">
<title>Authentication Design Activities</title>
<style>
/* Fira Sans is bundled (SIL Open Font License), no external font requests */
@font-face { font-family: "Fira Sans"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/fira-sans-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Fira Sans"; font-style: italic; font-weight: 400; font-display: swap; src: url("fonts/fira-sans-latin-400-italic.woff2") format("woff2"); }
@font-face { font-family: "Fira Sans"; font-style: normal; font-weight: 500; font-display: swap; src: url("fonts/fira-sans-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Fira Sans"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/fira-sans-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Fira Sans"; font-style: normal; font-weight: 800; font-display: swap; src: url("fonts/fira-sans-latin-800-normal.woff2") format("woff2"); }
:root {
  /* Palette taken from the printed booklet: mint ground, navy ink, five process colours */
  --mint: #d1efe4;        /* cover ground, shapes on activity pages */
  --mint-soft: #e8f6f0;   /* page ground */
  --paper: #ffffff;
  --navy: #202c51;        /* text, dark process colour */
  --ink-soft: #4c5878;
  --c-blue: #1f4a9a;      /* headings, People & Data */
  --c-sky: #6dbcdf;
  --c-yellow: #e6ee58;
  --c-green: #86d3b4;
  --c-orange: #f39237;
  --c-navy: #202c51;
  --line: #b9ddd0;
  --font-display: "Fira Sans", "Segoe UI", system-ui, sans-serif;
  --font-body: "Fira Sans", "Segoe UI", system-ui, sans-serif;
  --radius: 14px;
  color-scheme: light;
  /* Layout: a top bar, then one view at a time; activity pages mimic the booklet's A4-landscape spreads */
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--mint-soft); color: var(--navy); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--c-orange); outline-offset: 2px; }
.caps { text-transform: uppercase; letter-spacing: .22em; font-weight: 700; font-size: .78rem; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* Top bar */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px; padding: 10px 24px; background: var(--paper); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--c-blue); font-weight: 800; font-size: 1.02rem; }
.brand svg { flex: none; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { text-decoration: none; color: var(--navy); padding: 6px 12px; border-radius: 999px; font-weight: 500; }
.nav a[aria-current="page"] { background: var(--mint); color: var(--c-blue); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.proj-name { font-size: .9rem; color: var(--ink-soft); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lang { display: inline-flex; border: 1.5px solid var(--navy); border-radius: 999px; overflow: hidden; }
.lang button { border: 0; background: transparent; padding: 3px 10px; font-weight: 700; font-size: .8rem; }
.lang button[aria-pressed="true"] { background: var(--navy); color: #fff; }
.btn { border: 1.5px solid var(--navy); background: var(--paper); border-radius: 999px; padding: 6px 14px; font-weight: 500; font-size: .92rem; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--mint); }
a.btn { text-decoration: none; color: var(--navy); }
a.btn.primary { color: #fff; }
.btn.primary { background: var(--c-blue); border-color: var(--c-blue); color: #fff; }
.btn.primary:hover { background: var(--navy); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--mint); }
.btn.small { padding: 3px 10px; font-size: .82rem; }

main { padding: 28px 24px 80px; max-width: 1240px; margin: 0 auto; }

/* Start */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); background: var(--mint); border-radius: 22px; overflow: hidden; min-height: 380px; }
.hero-text { padding: 44px 40px; display: flex; flex-direction: column; gap: 16px; }
.hero h1 { color: var(--c-blue); font-size: clamp(1.8rem, 3.4vw, 2.7rem); font-weight: 800; line-height: 1.1; }
.hero .sub { font-style: italic; font-size: 1.2rem; color: var(--navy); max-width: 32ch; }
.hero p { max-width: 58ch; margin: 0; }
.hero-art { position: relative; min-height: 300px; }
.hero-art canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.start-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 22px; }
.panel { background: var(--paper); border-radius: var(--radius); padding: 22px 24px; }
.panel h2 { color: var(--c-blue); margin-bottom: 10px; }
.panel p, .panel ol { margin: 0 0 8px; max-width: 65ch; }
.panel ol { padding-left: 1.2em; }
.panel li { margin-bottom: 6px; }
.proj-card .bar { height: 10px; border-radius: 999px; background: var(--mint); overflow: hidden; display: flex; margin: 12px 0 6px; }
.proj-card .bar span { display: block; height: 100%; }
.proj-card input { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 1.05rem; font-weight: 700; color: var(--c-blue); }
.example-flag { display: inline-block; background: var(--c-yellow); border-radius: 999px; padding: 1px 10px; font-size: .78rem; font-weight: 700; margin-top: 8px; }

/* Process band (like the booklet's contents bars) */
.band { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin: 4px 0 26px; }
.band a { text-decoration: none; padding: 10px 10px 8px; border-radius: 6px; font-weight: 700; font-size: .86rem; line-height: 1.2; display: flex; flex-direction: column; gap: 8px; min-height: 76px; justify-content: space-between; }
.band a.outline { box-shadow: inset 0 0 0 1.5px var(--navy); }
.band .meter { height: 4px; background: rgba(255,255,255,.45); border-radius: 4px; overflow: hidden; }
.band .meter i { display: block; height: 100%; background: currentColor; }
.band small { font-weight: 500; opacity: .85; }

.cat-block { margin-bottom: 30px; scroll-margin-top: 80px; }
.cat-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.cat-chip { display: inline-block; padding: 3px 12px; border-radius: 4px; font-weight: 700; font-size: .84rem; }
.cat-chip.outline { box-shadow: inset 0 0 0 1.5px var(--navy); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.card { background: var(--paper); border-radius: var(--radius); padding: 14px 16px 12px; text-decoration: none; color: var(--navy); display: flex; flex-direction: column; gap: 6px; border: 1.5px solid transparent; position: relative; min-height: 118px; }
.card:hover { border-color: var(--c-blue); }
.card .num { font-size: .72rem; }
.card h3 { font-size: 1rem; font-weight: 700; line-height: 1.25; }
.card .meta { margin-top: auto; font-size: .8rem; color: var(--ink-soft); display: flex; gap: 8px; align-items: center; }
.state { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--navy); display: inline-block; flex: none; }
.state.started { background: linear-gradient(90deg, var(--navy) 50%, transparent 50%); }
.state.done { background: var(--navy); }
.card .tag { position: absolute; right: 12px; top: 12px; font-size: .7rem; background: var(--c-yellow); border-radius: 999px; padding: 0 8px; font-weight: 700; }

/* Activity page */
.act-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: start; }
.act-label { display: inline-block; padding: 3px 12px; border-radius: 4px; margin-bottom: 14px; }
.act-head h1 { color: var(--c-blue); font-size: clamp(1.5rem, 2.6vw, 2.1rem); font-weight: 800; line-height: 1.15; }
.act-q { font-size: 1.15rem; font-style: italic; margin: 8px 0 12px; max-width: 60ch; }
.act-i { max-width: 70ch; color: var(--ink-soft); margin: 0; }
.recs { position: relative; width: var(--rs, 230px); height: var(--rs, 230px); justify-self: end; display: flex; align-items: center; justify-content: center; }
.recs::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--mint); }
.recs-in { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 0 10px; width: 260px; }
.recs .caps { font-size: .66rem; color: var(--c-blue); margin-bottom: 6px; line-height: 1.5; }
.recs.many { --rs: 268px; }
.recs.lots { --rs: 310px; }
.recs.lots .recs-in { gap: 0; }
.recs button, .recs span:not(.caps) { background: none; border: 0; padding: 3px 4px; min-height: 24px; font-size: .84rem; line-height: 1.3; color: var(--navy); border-radius: 4px; }
.recs button { text-decoration: underline; text-decoration-color: var(--c-sky); text-underline-offset: 3px; }
.recs button:hover { background: var(--paper); }
.act-tools { display: flex; align-items: center; gap: 10px; margin: 18px 0 18px; flex-wrap: wrap; }
.act-body { background: var(--paper); border-radius: 18px; padding: 24px; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; }
.pager a { text-decoration: none; color: var(--navy); font-weight: 500; }
.hint { font-size: .86rem; color: var(--ink-soft); }

/* Generic notes */
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.col { background: var(--mint-soft); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 160px; }
.col h3 { font-size: .74rem; text-transform: uppercase; letter-spacing: .16em; color: var(--c-blue); font-weight: 700; padding: 2px 4px 4px; line-height: 1.45; }
.note { position: relative; background: var(--paper); border-radius: 8px; box-shadow: 0 1px 0 var(--line); border-left: 5px solid var(--accent, var(--c-sky)); }
.note textarea { width: 100%; border: 0; resize: none; background: transparent; padding: 8px 28px 8px 10px; min-height: 40px; overflow: hidden; display: block; line-height: 1.4; }
.note textarea:focus { outline: none; }
.note:focus-within { box-shadow: 0 0 0 2px var(--c-blue); }
.note .x { position: absolute; top: 4px; right: 4px; border: 0; background: transparent; color: var(--ink-soft); width: 22px; height: 22px; border-radius: 50%; font-size: 1rem; line-height: 1; opacity: .8; }
.note .x:hover { opacity: 1; background: var(--mint); }
.add { border: 1.5px dashed var(--line); background: transparent; border-radius: 8px; padding: 6px; color: var(--ink-soft); font-size: .88rem; }
.add:hover { border-color: var(--c-blue); color: var(--c-blue); }

/* Plan (activity 2) */
.plan-scroll { overflow-x: auto; padding-bottom: 6px; }
.plan { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 18px 12px; }
.plan-col { display: flex; flex-direction: column; gap: 6px; }
.plan-col > .cat-chip { text-align: center; margin-bottom: 4px; }
.mchip { overflow-wrap: anywhere; border: 1.5px solid transparent; background: var(--mint-soft); border-radius: 999px; padding: 4px 10px; font-size: .82rem; text-align: left; display: flex; align-items: center; gap: 6px; line-height: 1.2; }
.mchip .state { width: 11px; height: 11px; }
.state.ring { box-shadow: 0 0 0 3px var(--paper), 0 0 0 4.5px var(--navy); margin: 0 3px; }
.mchip.planned { border-color: var(--navy); background: var(--paper); }
.mchip.done { background: var(--navy); color: #fff; }
.mchip.done .state { border-color: #fff; background: #fff; }
.who { border: 0; border-bottom: 1px solid var(--line); background: transparent; font-size: .78rem; padding: 0 10px 2px 26px; width: 100%; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .85rem; margin-bottom: 14px; align-items: center; }
.legend span { display: inline-flex; gap: 10px; align-items: center; }

/* Journey (activity 6) */
.jmeta { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; margin-bottom: 18px; }
.field label { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .16em; color: var(--c-blue); font-weight: 700; margin-bottom: 4px; }
.field input, .field textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 10px; background: var(--paper); }
.tl-scroll { overflow-x: auto; padding: 0 8px; }
.timeline { position: relative; height: 150px; cursor: copy; touch-action: none; min-width: 100%; }
.timeline .axis { position: absolute; left: 0; right: 14px; top: 74px; height: 3px; background: var(--c-blue); border-radius: 3px; }
.timeline .axis::after { content: ""; position: absolute; right: -14px; top: -7px; border-left: 16px solid var(--c-blue); border-top: 8px solid transparent; border-bottom: 8px solid transparent; }
.tnode { position: absolute; top: 56px; transform: translateX(-50%); width: 38px; height: 38px; cursor: grab; touch-action: none; }
.tnode .dot { width: 38px; height: 38px; border-radius: 50%; background: var(--paper); border: 3px solid var(--c-blue); display: grid; place-items: center; font-weight: 800; color: var(--c-blue); }
.tnode.tp .dot { background: var(--c-yellow); border-color: var(--navy); color: var(--navy); }
.tnode.sel .dot { box-shadow: 0 0 0 4px var(--c-sky); }
.tnode .lbl { position: absolute; left: 50%; transform: translateX(-50%); top: 46px; width: 124px; font-size: .78rem; text-align: center; line-height: 1.2; color: var(--navy); max-height: 3.7em; overflow: hidden; }
.tnode.above .lbl { top: auto; bottom: 46px; }
.tnode.dragging { cursor: grabbing; }
.matrix-wrap { overflow-x: auto; margin-top: 14px; }
.matrix { border-collapse: separate; border-spacing: 6px; min-width: 100%; }
.matrix th { text-align: left; vertical-align: top; font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--c-blue); padding: 6px 4px; white-space: nowrap; }
.matrix td { vertical-align: top; min-width: 170px; }
.matrix td textarea { width: 100%; border: 0; background: var(--mint-soft); border-radius: 8px; padding: 6px 8px; resize: vertical; min-height: 52px; font-size: .88rem; }
.matrix td.sel textarea { background: #fdfde6; }
.stephead { background: var(--mint); border-radius: 8px; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; }
.stephead input[type=text] { border: 0; background: transparent; font-weight: 700; padding: 0; width: 100%; }
.stephead .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: .78rem; }
.stephead label { display: inline-flex; gap: 4px; align-items: center; }
.tplist { margin-top: 18px; background: var(--mint-soft); border-radius: 12px; padding: 12px 16px; }
.tplist ol { margin: 6px 0 0; padding-left: 1.4em; }

/* Zones (activity 10) */
.zones { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 22px; }
.zstage { position: relative; width: 100%; max-width: 620px; aspect-ratio: 1; margin: 0 auto; touch-action: none; user-select: none; }
.zstage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.zitem { position: absolute; transform: translate(-50%, -50%); background: var(--paper); border: 1.5px solid var(--navy); border-radius: 999px; padding: 3px 12px; font-size: .82rem; cursor: grab; white-space: nowrap; box-shadow: 0 2px 0 rgba(32,44,81,.15); touch-action: none; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
.zitem.dragging { cursor: grabbing; box-shadow: 0 6px 16px rgba(32,44,81,.25); z-index: 3; }
.zitem.out { border-style: dashed; color: var(--ink-soft); }
.zside { display: flex; flex-direction: column; gap: 10px; }
.zrow { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: start; background: var(--mint-soft); border-radius: 10px; padding: 8px 10px; }
.zrow .zn { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .82rem; border: 2.5px solid; background: var(--paper); }
.zrow input { width: 100%; border: 0; background: transparent; padding: 1px 0; }
.zrow input.zl { font-weight: 700; }
.zrow input.za { font-size: .85rem; color: var(--ink-soft); }
.zrow .items { font-size: .8rem; color: var(--ink-soft); margin-top: 2px; }
.seg { display: inline-flex; background: var(--mint-soft); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 4px 14px; font-weight: 500; font-size: .88rem; }
.seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
.addrow { display: flex; gap: 6px; }
.addrow input { flex: 1; border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 12px; min-width: 0; }

/* Directions (activity 15) */
.dirs { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 24px; }
.dgrid { position: relative; }
.drow { display: grid; grid-template-columns: 130px minmax(0, 1fr) 130px 26px; align-items: center; gap: 12px; height: 54px; }
.drow .l { text-align: right; font-weight: 500; }
.drow .r { font-weight: 500; }
.drow.unset .l, .drow.unset .r { color: var(--ink-soft); font-weight: 400; }
.track { position: relative; height: 34px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1.5px; background: var(--c-sky); border-radius: 3px; }
.track::after { content: ""; position: absolute; left: 50%; top: 9px; width: 1.5px; height: 16px; background: var(--c-sky); }
.track input[type=range] { position: absolute; inset: 0; width: 100%; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; z-index: 2; }
.track input[type=range]::-webkit-slider-runnable-track { height: 34px; background: transparent; }
.track input[type=range]::-moz-range-track { height: 34px; background: transparent; }
.track input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: 2px; border: 0; background: transparent; }
.track input[type=range]::-moz-range-thumb { width: 30px; height: 30px; border: 0; background: transparent; }
.drow.unset .track input { opacity: 1; }
.dprofile { position: absolute; top: 0; pointer-events: none; overflow: visible; z-index: 1; }
.dprofile path { fill: none; stroke: var(--c-orange); stroke-width: 2.5; stroke-linejoin: round; }
.dprofile .xmark line { stroke: var(--c-orange); stroke-width: 4; stroke-linecap: round; }
.dprofile .xmark.ghost line { stroke: var(--line); stroke-width: 3; }
.drow .del { border: 0; background: transparent; color: var(--ink-soft); border-radius: 50%; width: 24px; height: 24px; }
.drow .del:hover { background: var(--mint); }
.dside { display: flex; flex-direction: column; gap: 14px; }
.dside textarea { width: 100%; min-height: 150px; border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; resize: vertical; }

/* Methods */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 18px; }
.filters button { border: 1.5px solid var(--navy); border-radius: 999px; background: var(--paper); padding: 4px 12px; font-size: .85rem; font-weight: 500; }
.filters button[aria-pressed="true"] { background: var(--navy); color: #fff; }
.search { border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 14px; width: min(360px, 100%); background: var(--paper); }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.mcard { background: var(--paper); border-radius: var(--radius); padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; }
.mcard h3 { font-size: .86rem; text-transform: uppercase; letter-spacing: .16em; color: var(--c-blue); line-height: 1.4; }
.mcard p { margin: 0; font-size: .93rem; }
.dots { display: flex; gap: 4px; }
.dots i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.dots i.outline { box-shadow: inset 0 0 0 1.5px var(--navy); }
.used { font-size: .82rem; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.used a { color: var(--navy); background: var(--mint-soft); border-radius: 999px; padding: 0 8px; text-decoration: none; font-variant-numeric: tabular-nums; }
.used a:hover { background: var(--mint); }

/* Modal */
dialog { border: 0; border-radius: 18px; padding: 0; max-width: min(620px, calc(100% - 32px)); width: 100%; color: var(--navy); }
dialog::backdrop { background: rgba(32,44,81,.45); }
.dlg { padding: 24px 26px; display: flex; flex-direction: column; gap: 12px; }
.dlg h2 { color: var(--c-blue); }
.dlg textarea { width: 100%; min-height: 160px; border: 1.5px solid var(--line); border-radius: 10px; padding: 8px; font-family: ui-monospace, monospace; font-size: .78rem; }
.dlg .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.dlg .msg { font-size: .88rem; color: var(--c-blue); min-height: 1.3em; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: .9rem; z-index: 50; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }


/* chips in side lists */
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 2px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 1px 4px 1px 10px; font-size: .8rem; }
.chip button { border: 0; background: transparent; width: 20px; height: 20px; border-radius: 50%; line-height: 1; color: var(--ink-soft); }
.chip button:hover { background: var(--mint); }
.zrow.single { grid-template-columns: 1fr; }

.rq-src { background: var(--mint-soft); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; align-self: start; }
.quote { border: 0; text-align: left; background: var(--paper); border-radius: 8px; padding: 6px 10px; font-size: .85rem; border-left: 4px solid var(--c-blue); }
.quote:hover { background: #fdfde6; }
.quote.used { background: var(--mint-soft); color: var(--ink-soft); border-style: dashed; }
.rq-row { display: grid; grid-template-columns: 1.2fr .7fr 1.4fr auto 24px; gap: 8px; align-items: start; background: var(--paper); border: 1.5px solid var(--line); border-left: 6px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
.rq-row.prio-must { border-left-color: var(--c-orange); }
.rq-row.prio-should { border-left-color: var(--c-yellow); }
.rq-row.prio-could { border-left-color: var(--c-sky); }
.rq-row input, .rq-row textarea { border: 1.5px solid var(--line); border-radius: 6px; padding: 4px 6px; font-size: .86rem; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--navy); resize: vertical; }
.seg.small button { padding: 2px 9px; font-size: .78rem; text-transform: none; letter-spacing: 0; }
.sb { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.sb-panel { background: var(--paper); border: 2.5px solid var(--navy); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.sb-head { display: flex; gap: 4px; align-items: center; }
.sb-tools { display: inline-flex; gap: 4px; align-items: center; margin-left: 6px; }
.pen { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--paper); background: var(--pc); box-shadow: 0 0 0 1.5px var(--line); padding: 0; }
.pen.on, .tool.on { box-shadow: 0 0 0 2.5px var(--navy); }
.tool { border: 1px solid var(--line); background: var(--paper); border-radius: 5px; width: 24px; height: 22px; padding: 0; font-size: .8rem; }
label.tool { display: inline-grid; place-items: center; cursor: pointer; }
label.tool:focus-within { outline: 3px solid var(--c-orange); outline-offset: 2px; }
.sb-head .mv { border: 0; background: transparent; width: 20px; color: var(--ink-soft); }
.sb-panel canvas { width: 100%; aspect-ratio: 3 / 2; border: 1px solid var(--line); border-radius: 4px; touch-action: none; cursor: crosshair; background: #fff; }
.sb-panel textarea { border: 0; border-top: 1px dashed var(--line); padding: 6px 2px; resize: vertical; font-style: italic; }
.sb-www { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.sb-www input { border: 0; border-bottom: 1px solid var(--line); font-size: .8rem; min-width: 0; }
.wall { position: relative; width: 100%; aspect-ratio: 16 / 8; min-height: 440px; background: var(--mint-soft) radial-gradient(var(--line) 1px, transparent 1px) 0 0 / 18px 18px; border-radius: 12px; overflow: hidden; }
.sticky { position: absolute; width: 170px; min-height: 130px; background: var(--sc); transform: rotate(var(--rot)); box-shadow: 0 4px 10px rgba(32,44,81,.18); display: flex; flex-direction: column; }
.sticky.dragging { box-shadow: 0 12px 24px rgba(32,44,81,.3); z-index: 5; }
.sticky-grip { cursor: grab; display: flex; align-items: center; justify-content: space-between; padding: 3px 4px 2px 8px; font-size: .64rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: var(--navy); background: rgba(255,255,255,.28); touch-action: none; }
.sticky textarea { flex: 1; border: 0; background: transparent; resize: none; padding: 6px 8px; font-size: .9rem; line-height: 1.35; min-height: 100px; }
.mm-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; }
.mmstage { position: relative; width: 100%; aspect-ratio: 16 / 10; min-height: 380px; background: var(--mint-soft); border-radius: 12px; touch-action: none; }
.mmstage > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.mnode { position: absolute; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 2px; background: var(--paper); border: 1.5px solid var(--navy); border-radius: 999px; padding: 2px 4px 2px 6px; cursor: grab; box-shadow: 0 2px 0 rgba(32,44,81,.12); }
.mnode.d0 { background: var(--c-yellow); padding: 6px 8px; font-weight: 800; }
.mnode.d0 input { font-weight: 800; font-size: 1rem; }
.mnode.d2 { border-color: var(--c-sky); }
.mnode.sel { box-shadow: 0 0 0 3px var(--c-orange); }
.mnode .grip { color: var(--ink-soft); font-size: .8rem; }
.mnode input { border: 0; background: transparent; font-size: .86rem; padding: 0 2px; min-width: 0; }
.mnode .plus { border: 0; background: var(--mint); border-radius: 50%; width: 20px; height: 20px; padding: 0; line-height: 1; font-weight: 800; color: var(--c-blue); }
.mm-side { background: var(--mint-soft); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; align-self: start; }
.mm-side textarea { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--navy); border: 1.5px solid var(--line); border-radius: 8px; padding: 6px; font-size: .88rem; }
.mm-list { list-style: none; padding: 0; margin: 0; font-size: .85rem; display: flex; flex-direction: column; gap: 2px; }
.rep-story { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.rep-story figure { margin: 0; border: 1.5px solid var(--navy); padding: 4px; break-inside: avoid; }
.rep-story img { width: 100%; display: block; }
.rep-blank { aspect-ratio: 3 / 2; background: var(--mint-soft); }
.rep-story figcaption { font-size: .8rem; padding: 4px 2px 0; }

/* v5: motion that supports orientation (disabled for reduced motion) */
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { opacity: 0; transform: scale(.85); } 70% { transform: scale(1.04); } 100% { opacity: 1; transform: none; } }
@keyframes popc { 0% { opacity: 0; scale: .85; } 70% { scale: 1.06; } 100% { opacity: 1; scale: 1; } }
@keyframes dlgIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
#view.enter > * { animation: viewIn .28s ease-out both; }
#view.enter > *:nth-child(2) { animation-delay: .04s; } #view.enter > *:nth-child(3) { animation-delay: .08s; }
.fresh { animation: pop .34s cubic-bezier(.3,1.4,.6,1) both; }
.zitem.fresh, .mnode.fresh, .tnode.fresh, .pbubble.fresh, .inode.fresh { animation: popc .34s cubic-bezier(.3,1.4,.6,1) both; }
dialog[open] { animation: dlgIn .2s ease-out; }
.band .meter i { transition: width .7s cubic-bezier(.2,.8,.2,1); }
.proj-card .bar span { transition: width .7s cubic-bezier(.2,.8,.2,1); }
.state { transition: background .2s; }
.zitem, .pbubble, .tnode, .mnode, .inode { transition: box-shadow .15s, background .15s; }
.pbubble { transition: left .45s cubic-bezier(.2,.8,.2,1), top .45s cubic-bezier(.2,.8,.2,1), box-shadow .15s; }
.hex { transition: transform .18s, background .18s, color .18s; }
.loop { transition: transform .18s, box-shadow .18s; }
.toast { transition: opacity .2s, transform .2s; transform: translate(-50%, 8px); }
.toast.show { transform: translate(-50%, 0); }
#undoBtn { font-size: 1.05rem; padding: 2px 10px; }
#undoBtn:disabled { opacity: .35; cursor: default; }
#undoBtn:disabled:hover { background: transparent; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* user groups (3) */
.gcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.gcard { background: var(--mint-soft); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; border-top: 6px solid var(--g); }
.g-top { display: flex; align-items: center; gap: 8px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--g, var(--c-sky)); color: var(--navy); display: grid; place-items: center; font-weight: 800; font-size: .82rem; flex: none; box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); }
.g-title { flex: 1; min-width: 0; border: 0; border-bottom: 1.5px solid var(--line); background: transparent; font-weight: 800; font-size: 1.02rem; color: var(--c-blue); }
.gcard .x, .ivrow .x, .it-card .x { border: 0; background: transparent; border-radius: 50%; width: 24px; height: 24px; color: var(--ink-soft); }
.rolechips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.rolechips button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 1px 9px; font-size: .76rem; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--navy); }
.rolechips button[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
.gcard textarea, .gcard input:not(.g-title), .ivrow textarea, .ivrow input, .ivrow select { border: 1.5px solid var(--line); border-radius: 6px; padding: 4px 6px; font-size: .86rem; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--navy); background: var(--paper); resize: vertical; }
/* involvement (4) */
.ivrows { display: flex; flex-direction: column; gap: 10px; }
.ivrow { display: grid; grid-template-columns: 210px 1fr 1fr 1fr; gap: 12px; background: var(--paper); border: 1.5px solid var(--line); border-left: 6px solid var(--g); border-radius: 12px; padding: 10px 12px; }
.iv-who { display: flex; flex-direction: column; gap: 4px; }
.ivrow > .mini:last-child { grid-column: 2 / -1; }
.ladder { display: flex; gap: 3px; margin-top: 4px; }
.ladder button { flex: 1; border: 0; background: var(--mint-soft); border-radius: 6px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .64rem; text-transform: none; letter-spacing: 0; color: var(--ink-soft); }
.ladder button i { display: block; width: 100%; height: 5px; border-radius: 3px; background: var(--line); }
.ladder button:nth-child(2) i { height: 9px; } .ladder button:nth-child(3) i { height: 13px; }
.ladder button[aria-pressed="true"] { background: var(--navy); color: #fff; }
.ladder button[aria-pressed="true"] i { background: var(--c-yellow); }
.mpick { display: flex; flex-wrap: wrap; gap: 4px; margin: 3px 0 4px; }
/* star (18) */
.star-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; }
.starstage { position: relative; width: 100%; max-width: 620px; aspect-ratio: 1; margin: 0 auto; }
.starstage > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.star-centre { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 26%; aspect-ratio: 1; border-radius: 50%; background: var(--c-yellow); display: grid; place-items: center; box-shadow: 0 0 0 6px var(--paper), 0 0 0 7.5px var(--line); }
.star-centre input { width: 90%; border: 0; background: transparent; text-align: center; font-weight: 800; color: var(--navy); font-size: .88rem; }
.star-legend { position: absolute; right: 0; bottom: 0; font-size: .72rem; color: var(--ink-soft); }
.pbubble { position: absolute; transform: translate(-50%, -50%); border: 1.5px solid var(--navy); background: var(--paper); border-radius: 999px; padding: 4px 12px 4px 4px; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: .88rem; max-width: 46%; }
.pbubble .avatar { width: 28px; height: 28px; font-size: .7rem; }
.pbubble.sel { box-shadow: 0 0 0 3px var(--c-orange); }
.fit { width: 100%; accent-color: var(--c-blue); }
.fit-scale { display: flex; justify-content: space-between; font-size: .7rem; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink-soft); }
/* blueprint (19) */
.bp-scroll { overflow-x: auto; }
.bp { display: grid; gap: 6px; min-width: 640px; }
.bp-h { display: flex; align-items: center; gap: 5px; background: var(--mint); border-radius: 8px; padding: 5px 8px; }
.bp-h input { flex: 1; min-width: 0; border: 0; background: transparent; font-weight: 700; }
.bp-h .x { border: 0; background: transparent; color: var(--ink-soft); border-radius: 50%; }
.bp-lab { display: flex; flex-direction: column; justify-content: center; font-size: .8rem; padding: 4px 6px; border-radius: 8px; }
.bp-lab b { color: var(--c-blue); text-transform: uppercase; letter-spacing: .1em; font-size: .7rem; }
.bp-lab span { color: var(--ink-soft); font-size: .76rem; }
.bp-lab.in { background: #eef1f7; }
.bp-cell { border: 0; border-radius: 8px; padding: 6px 8px; resize: vertical; font-size: .86rem; min-height: 64px; }
.bp-cell.out { background: var(--mint-soft); }
.bp-cell.in { background: #eef1f7; }
.bp-line { position: relative; height: 22px; display: flex; align-items: center; }
.bp-line::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px dashed var(--c-orange); }
.bp-line span { position: relative; background: var(--paper); padding: 0 10px; margin-left: 12px; font-size: .68rem; text-transform: uppercase; letter-spacing: .16em; font-weight: 700; color: #a5520c; }
/* pattern hexes (23) */
.hexes { display: flex; flex-wrap: wrap; gap: 6px 4px; padding-left: 8px; }
.hex { width: 150px; height: 130px; border: 0; background: var(--mint-soft); clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); display: grid; place-items: center; padding: 0 26px; text-align: center; font-weight: 700; color: var(--navy); font-size: .88rem; line-height: 1.25; }
.hex:nth-child(even) { margin-top: 66px; margin-left: -34px; margin-right: -34px; }
.hex:hover { transform: scale(1.04); }
.hex.on { background: var(--g); color: var(--navy); }
.hex.add { background: transparent; outline: 0; color: var(--ink-soft); box-shadow: none; background-image: repeating-linear-gradient(45deg, var(--mint-soft) 0 6px, transparent 6px 12px); }
/* preparation (25) */
.chain { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px 4px; }
.ch-end { width: 132px; hyphens: auto; overflow-wrap: anywhere; font-size: .78rem !important; border-radius: 50%; aspect-ratio: 1; display: grid; place-items: center; text-align: center; background: var(--navy); color: #fff; font-weight: 700; font-size: .84rem; padding: 10px; align-self: center; }
.ch-end.start { background: var(--c-yellow); color: var(--navy); }
.prstep.ritual { border-style: dashed; }
/* infrastructure (29) */
.mmstage.infra { background: var(--paper) radial-gradient(var(--line) 1px, transparent 1px) 0 0 / 16px 16px; border: 1.5px solid var(--line); }
.inode { position: absolute; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 6px; background: var(--paper); border: 1.5px solid var(--navy); border-radius: 10px; padding: 6px 10px; cursor: grab; font-size: .86rem; font-weight: 600; touch-action: none; box-shadow: 0 2px 0 rgba(32,44,81,.12); }
.inode .ic { color: var(--c-blue); display: inline-flex; }
.inode.sel { box-shadow: 0 0 0 3px var(--c-sky); }
.inode.picked { background: var(--c-yellow); }
.inode.risk { border-color: var(--c-orange); border-width: 2.5px; }
.inode .rk { position: absolute; top: -9px; right: -9px; width: 18px; height: 18px; border-radius: 50%; background: var(--c-orange); color: #fff; font-weight: 800; font-size: .72rem; display: grid; place-items: center; }
.ifadd { display: inline-flex; align-items: center; gap: 4px; }
.ifadd svg { color: var(--c-blue); }
/* iterations (31) */
.loops { display: flex; flex-wrap: wrap; align-items: center; padding: 8px 4px 16px; }
.loop { width: 128px; aspect-ratio: 1; border-radius: 50%; border: 0; margin-right: -18px; background: conic-gradient(var(--c-green) var(--met, 0deg), var(--mint-soft) 0); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; padding: 0; }
.loop::before { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--line); }
.loop > * { position: relative; }
.loop .lv { font-weight: 800; color: var(--c-orange); font-size: 1.1rem; }
.loop .ln { font-size: .76rem; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.loop .lm { font-size: .7rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.loop:hover { transform: translateY(-3px); z-index: 2; }
.loop.sel { z-index: 3; box-shadow: 0 0 0 3px var(--c-orange); }
.loop.add { background: transparent; }
.loop.add::before { box-shadow: inset 0 0 0 2px var(--line); background: transparent; border: 2px dashed var(--line); }
.loop.add .lv { color: var(--c-blue); }
.it-card { background: var(--mint-soft); border-radius: 12px; padding: 12px 14px; border-top: 6px solid var(--c-orange); }
.it-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 8px; }
.it-grid textarea { border: 1.5px solid var(--line); border-radius: 6px; padding: 6px; font-size: .86rem; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--navy); }
.metlist { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--navy); font-size: .86rem; }
.rep-line { color: var(--c-orange); font-size: .7rem; text-transform: uppercase; letter-spacing: .14em; border-top: 2px dashed var(--c-orange) !important; text-align: center; }

/* v6: accessibility helpers */
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--navy); color: #fff; border: 0; border-radius: 0 0 10px 10px; padding: 10px 16px; font-weight: 700; }
.skip:focus { top: 0; }
#view:focus { outline: none; }
h1:focus { outline: none; }
h1:focus-visible { outline: 3px solid var(--c-orange); outline-offset: 4px; }
.view-toggle { display: flex; justify-content: flex-end; margin: -6px 0 10px; }
.lb-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
.lb-table th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .14em; color: var(--c-blue); padding: 6px; border-bottom: 2px solid var(--line); }
.lb-table td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.lb-table td textarea { width: 100%; min-width: 140px; font: inherit; font-size: .9rem; border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.lm-tree { list-style: none; margin: 0; padding: 0; }
.lm-tree .lm-tree { margin: 8px 0 0 14px; padding-left: 14px; border-left: 2px solid var(--c-green); }
.lm-tree li { margin: 0 0 10px; }
.lm-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.lm-row .lm-text { flex: 1 1 220px; }
.lm-tree .mini { display: block; margin-top: 6px; }
.lm-tree .mini textarea { width: 100%; }
.lil-list { list-style: none; padding: 0; margin: 8px 0 0; }
.lil-list .mrow { display: flex; gap: 12px; align-items: center; }
.lil-list .mk { min-width: 260px; font-weight: 700; }
.lb-table input, .lb-table select { width: 100%; border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--paper); }
.lb-table input[aria-invalid="true"], .cin.invalid { border-color: var(--c-orange) !important; box-shadow: 0 0 0 2px var(--c-orange); }
.lb-act { white-space: nowrap; width: 1%; }
/* chip kit: rename & duplicate */
.zitem .ck { display: none; gap: 2px; margin-left: 6px; vertical-align: middle; }
.zitem:hover .ck, .zitem:focus-within .ck, .zitem:focus .ck { display: inline-flex; }
.zitem .ck button { border: 0; background: var(--mint); border-radius: 50%; width: 20px; height: 20px; padding: 0; font-size: .72rem; line-height: 1; color: var(--navy); }
.zitem .ck button:hover { background: var(--c-yellow); }
.zitem:hover, .zitem:focus-within { z-index: 4; max-width: none; }
.zitem.editing { cursor: text; z-index: 6; }
.cin { border: 1.5px solid var(--c-blue); border-radius: 6px; padding: 1px 5px; font-size: .82rem; background: #fff; color: var(--navy); }
.zitem .cl { pointer-events: none; }
/* activity 7/20 labelled fields */
.sb-www { gap: 6px; }
.sb-www .mini { font-size: .64rem; }
.sb-www textarea { border: 1.5px solid var(--line); border-radius: 6px; padding: 4px 6px; font-size: .84rem; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--navy); resize: vertical; min-width: 0; width: 100%; }
/* activity 8 board */
.spstage { aspect-ratio: 2 / 1; }
/* activity 1 */
.p1 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.p1 > section { background: var(--mint-soft); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.p1-desc { grid-column: 1 / -1; }
.p1-desc textarea, .p1-m textarea { border: 1.5px solid var(--line); border-radius: 8px; padding: 8px; resize: vertical; }
.sec-h { color: var(--c-blue); font-size: .72rem; }
.p1-list { display: flex; flex-direction: column; gap: 6px; }
.p1-member { display: grid; grid-template-columns: 34px 1fr 1.3fr 30px 24px; gap: 6px; align-items: center; background: var(--paper); border-radius: 10px; padding: 6px 8px; border-left: 5px solid var(--g); }
.p1-member input { border: 0; border-bottom: 1.5px solid var(--line); min-width: 0; padding: 3px 2px; }
.star-tog { border: 0; background: transparent; font-size: 1.1rem; color: var(--line); border-radius: 50%; }
.star-tog[aria-pressed="true"] { color: var(--c-orange); }
